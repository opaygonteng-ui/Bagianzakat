<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>pembagian zakat</title>

<style>

body{
font-family:Arial;
background:#e9ecef;
margin:0;
padding:10px;
}

h2{
text-align:center;
}

input,select,textarea,button{
width:100%;
padding:12px;
margin:5px 0;
font-size:16px;
}

button{
border:none;
color:white;
}

.green{background:green;}
.blue{background:#007bff;}
.red{background:red;}
.gray{background:gray;}

.box{
background:white;
padding:10px;
margin-top:10px;
border-radius:8px;
}

.big{
font-size:18px;
padding:15px;
margin-top:10px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

td,th{
border:1px solid #ccc;
padding:5px;
font-size:14px;
text-align:center;
}

.listScroll{
max-height:200px;
overflow-y:auto;
border:1px solid #ccc;
padding:5px;
background:#f9f9f9;
}
.hasilScroll{
max-height:250px;
overflow-y:auto;
border:1px solid #ccc;
padding:5px;
background:white;
}

.btnKecil{
width:auto;
padding:2px 6px;
font-size:12px;
margin-left:5px;
background:red;
}

.hidden{
display:none;
}

</style>

</head>
<body>



<!-- ===================== -->
<!-- HALAMAN UTAMA -->
<!-- ===================== -->

<div id="pageUtama">

<h2>Zakat Fitrah</h2>

<div class="box">

Total Zakat terkumpul

<h3 id="infoTotal">0 kg</h3>

Total Mustahik

<h3 id="infoOrang">0</h3>

</div>



<div class="box">

<h3>Ringkasan Kategori</h3>

<div id="ringkasan"></div>

</div>



<div class="box">

<button class="green big"
onclick="hitung()">

HITUNG

</button>

<button class="blue big"
onclick="bukaPengaturan()">

PENGATURAN

</button>
</div>



<div class="box">

<h3>Hasil Pembagian</h3>

<div id="hasil" class="hasilScroll"></div>
<button onclick="exportPDF()">
EXPORT PDF
</button>
</div>
</script>
<div id="laporanPDF" style="display:none">

<h2 style="text-align:center">
LAPORAN PEMBAGIAN ZAKAT FITRAH
</h2>

<div id="pdfInfo"></div>

<hr>

<div id="pdfRingkasan"></div>

<br>

<div id="pdfTabel"></div>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</div>




<!-- ===================== -->
<!-- HALAMAN PENGATURAN -->
<!-- ===================== -->

<div id="pageSetting"
class="hidden">

<h2>Pengaturan</h2>



<div class="box">
Nama Masjid
<input id="namaMasjid">
Total Zakat (kg)

<input type="number"
id="total">

</div>



<div class="box">

<h3>Jenis Mustahik</h3>

Nama
<input id="jNama">

Persen
<input type="number"
id="jPersen">

<button class="blue"
onclick="addJenis()">

Tambah Jenis

</button>

<div id="listJenis"></div>

Total %
<span id="totalPersen">0</span>

</div>



<div class="box">

<h3>Mustahik</h3>

Nama
<input id="mNama">

Jenis
<select id="mJenis"></select>

<button class="blue"
onclick="addMustahik()">

Tambah

</button>


<textarea
id="mBanyak"
rows="6"
placeholder="1 nama per baris">

</textarea>

<button class="blue"
onclick="addBanyak()">

Tambah Banyak

</button>



</div>

<div class="box">

<button class="green big"
onclick="simpanTotal()">

Simpan

</button>


<button class="gray big"
onclick="tutupPengaturan()">

Kembali

</button>


<button class="red big"
onclick="resetData()">

Reset Semua

</button>
<div id="listMustahik" class="listScroll"></div>

</div>

</div>



<!-- ===================== -->
<!-- SCRIPT DI BAGIAN 2 -->
<!-- ===================== -->

<script>

let jenis =
JSON.parse(localStorage.getItem("jenis"))||[];

let mustahik =
JSON.parse(localStorage.getItem("mustahik"))||[];

let totalZakat =
Number(localStorage.getItem("totalZakat"))||0;
let namaMasjid =
localStorage.getItem("namaMasjid") || "";


function save(){

localStorage.setItem(
"jenis",
JSON.stringify(jenis)
);

localStorage.setItem(
"mustahik",
JSON.stringify(mustahik)
);

localStorage.setItem(
"totalZakat",
totalZakat
);
localStorage.setItem(
"namaMasjid",
namaMasjid
);

updateInfo();

}



function bukaPengaturan(){

pageUtama.classList.add("hidden");
pageSetting.classList.remove("hidden");

tampilJenis();
tampilMustahik();
updateSelect();

total.value=totalZakat;

}



function tutupPengaturan(){

pageSetting.classList.add("hidden");
pageUtama.classList.remove("hidden");

updateInfo();

}



function simpanTotal(){

totalZakat=
Number(total.value)||0;

namaMasjid=
document.getElementById(
"namaMasjid"
).value || "";

save();

alert("Disimpan");

}



function addJenis(){

let n=jNama.value;
let p=Number(jPersen.value)||0;

if(!n) return;

jenis.push({
nama:n,
persen:p
});

save();
tampilJenis();
updateSelect();

}



function tampilJenis(){

let html="";
let t=0;

jenis.forEach((j,i)=>{

html+=
j.nama+
" "+
"<input type=number value='"
+j.persen+
"' style='width:60px' "+
"onchange='editPersen("+i+",this.value)'> % "+
"<button onclick='hapusJenis("+i+")'>X</button><br>";

t+=Number(j.persen);

});

listJenis.innerHTML=html;
totalPersen.innerHTML=t;

}



function editPersen(i,v){

jenis[i].persen=Number(v)||0;

save();
tampilJenis();

}



function hapusJenis(i){

jenis.splice(i,1);

save();
tampilJenis();
updateSelect();

}



function updateSelect(){

let s="";

jenis.forEach(j=>{
s+="<option>"+j.nama+"</option>";
});

mJenis.innerHTML=s;

}



function addMustahik(){

let n=mNama.value;
let j=mJenis.value;

if(!n) return;

mustahik.push({
nama:n,
jenis:j
});

save();
tampilMustahik();

mNama.value="";

}



function addBanyak(){

let t=mBanyak.value;
let j=mJenis.value;

if(!t) return;

t.split("\n").forEach(n=>{

n=n.trim();

if(n){

mustahik.push({
nama:n,
jenis:j
});

}

});

save();
tampilMustahik();

mBanyak.value="";

}



function tampilMustahik(){

let html="";

html+="<table>";

html+="<tr>";
html+="<th>No</th>";
html+="<th>Nama</th>";
html+="<th>Jenis</th>";
html+="<th>Aksi</th>";
html+="</tr>";

mustahik.forEach((m,i)=>{

html+="<tr>";

html+="<td>"+(i+1)+"</td>";

html+="<td>"+m.nama+"</td>";

html+="<td>"+m.jenis+"</td>";

html+="<td>";

html+="<button class='btnKecil' ";
html+="onclick='editMustahik("+i+")'>Edit</button>";

html+="<button class='btnKecil' ";
html+="onclick='hapusMustahik("+i+")'>X</button>";

html+="</td>";

html+="</tr>";

});

html+="</table>";

listMustahik.innerHTML=html;

}

function editMustahik(i){

let n=prompt(
"Nama",
mustahik[i].nama
);

if(n){

mustahik[i].nama=n;

save();
tampilMustahik();

}

}



function hapusMustahik(i){

mustahik.splice(i,1);

save();
tampilMustahik();

}



function updateInfo(){

infoTotal.innerHTML=
totalZakat+" kg";

infoOrang.innerHTML=
mustahik.length;

}



function hitung(){

if(!totalZakat){
alert("Isi total zakat");
return;
}

let totalPers=0;

jenis.forEach(j=>{
totalPers+=Number(j.persen);
});

if(totalPers!=100){
alert("Total persen harus 100%");
return;
}

let hasil="";
let ring="";

let warnaIndex=0;

hasil+="<table>";
hasil+="<tr><th>Nama</th><th>Jenis</th><th>Kg</th></tr>";

jenis.forEach(j=>{

let bagian=
totalZakat*
Number(j.persen)/100;

let orang=
mustahik.filter(
m=>m.jenis==j.nama
);

let per=0;

if(orang.length>0){
per=bagian/orang.length;
}

ring+=
j.nama+
" : "+
bagian.toFixed(2)+
" kg / "+
orang.length+
" org = "+
per.toFixed(2)+
" kg<br>";

let warna="warna"+(warnaIndex%5);

hasil+="<tr class='"+warna+"'>";
hasil+="<th colspan=3>";
hasil+=j.nama+
" total "+bagian.toFixed(2)+
" kg";
hasil+="</th></tr>";

orang.forEach(o=>{

hasil+="<tr class='"+warna+"'>";
hasil+="<td>"+o.nama+"</td>";
hasil+="<td>"+j.nama+"</td>";
hasil+="<td>"+per.toFixed(2)+"</td>";
hasil+="</tr>";

});

warnaIndex++;

});

hasil+="</table>";

document.getElementById("hasil").innerHTML=hasil;
document.getElementById("ringkasan").innerHTML=ring;

updateInfo();

}


function resetData(){

if(confirm("Reset semua?")){

localStorage.clear();

jenis=[];
mustahik=[];
totalZakat=0;

updateInfo();

tampilJenis();
tampilMustahik();
updateSelect();

}

}



updateInfo();
tampilJenis();
tampilMustahik();
updateSelect();

function exportPDF(){

let elLaporan =
document.getElementById("laporanPDF");

let elRing =
document.getElementById("ringkasan");

let elHasil =
document.getElementById("hasil");

let elInfo =
document.getElementById("pdfInfo");

let elRingPdf =
document.getElementById("pdfRingkasan");

let elTabelPdf =
document.getElementById("pdfTabel");


let tgl =
new Date().toLocaleDateString();

elInfo.innerHTML =
"Masjid : "+namaMasjid+"<br>"+
"Tanggal : "+tgl+"<br>"+
"Total zakat : "+totalZakat+" kg";


elRingPdf.innerHTML =
elRing.innerHTML;

elTabelPdf.innerHTML =
elHasil.innerHTML;


elLaporan.style.display="block";


setTimeout(function(){

html2pdf().from(elLaporan).save(
"laporan_zakat.pdf"
);

elLaporan.style.display="none";

},300);

}
</script>
</body>
</html>
